[package]
name = "tachyon"
description = "Binario de Tachyon: corre un pipeline de streaming"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "tachyon"
path = "src/main.rs"

[dependencies]
tachyon-config = { path = "../crates/tachyon-config" }
tachyon-runtime = { path = "../crates/tachyon-runtime" }
tachyon-sink = { path = "../crates/tachyon-sink" }
anyhow.workspace = true
clap.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml.workspace = true
arrow.workspace = true
tokio = { workspace = true, features = ["signal"] }
tracing.workspace = true
tracing-subscriber.workspace = true
# Allocator global: ~20 hilos (poll, decode, shards del sink) alocan batches
# grandes todo el tiempo; con el malloc de glibc eso era ~7% del CPU entre
# malloc/free y page faults.
mimalloc = { version = "0.1", default-features = false }

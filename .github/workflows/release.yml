# Release: binarios precompilados para GitHub Releases.
#
# Se dispara con una tag `v*` (p. ej. `v0.1.0`) o manualmente con
# `workflow_dispatch`. La version se toma de la tag (o del workspace si es
# manual) y se versiona el workspace in situ antes de compilar.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: x86_64-apple-darwin
            os: macos-14
          - target: aarch64-apple-darwin
            os: macos-14
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Instalar herramienta de cross-compilación (aarch64-linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Derivar la version (tag o workspace)
        id: version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version=$(cargo metadata --no-deps --format-version 1 \
              | sed -n 's/.*"workspace_root[^}]*"version":"\([^"]*\)".*/\1/p' | head -1)
            # fallback simple: leer el campo del workspace
            version=$(awk -F'"' '/^version = /{print $4; exit}' Cargo.toml)
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Fijar la version del workspace
        run: |
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            sed -i "s/^version = .*/version = \"${{ steps.version.outputs.version }}\"/" Cargo.toml
          fi

      - name: Instalar Rust + target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Configurar cross-compile (aarch64-linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        shell: bash
        run: |
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          # cmake del host para librdkafka (cmake-build): es binario portable
          # y los .c de librdkafka no dependen de la arquitectura del host.
          echo "CMAKE_AARCH64_UNKNOWN_LINUX_GNU=/usr/bin/cmake" >> "$GITHUB_ENV"

      - name: Compilar
        run: cargo build --release --target ${{ matrix.target }} --bin tachyon

      - name: Empaquetar
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          target="${{ matrix.target }}"
          dir="tachyon-${version}-${target}"
          mkdir -p "$dir"
          cp "target/${target}/release/tachyon" "$dir/"
          cp README.md "$dir/"
          (cd "$dir" && sha256sum tachyon > tachyon.sha256)
          tar czf "${dir}.tar.gz" "$dir"

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: tachyon-${{ steps.version.outputs.version }}-${{ matrix.target }}
          path: tachyon-${{ steps.version.outputs.version }}-${{ matrix.target }}.tar.gz

  publish:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - name: Descargar artefactos
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publicar en GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*/*.tar.gz
          generate_release_notes: true

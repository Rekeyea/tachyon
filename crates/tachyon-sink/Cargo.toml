[package]
name = "tachyon-sink"
description = "Conector sink Paimon (writer por bucket)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tachyon-core = { path = "../tachyon-core" }
# Stack alineado (ver invariante de versiones en el Cargo.toml del workspace):
# paimon 0.3.0 trae arrow 58 vía paimon-datafusion; no actualizar sin re-alinear.
paimon = "0.3"
arrow = "58"
anyhow = "1"
tracing = "0.1"
futures = "0.3"
serde_json = "1"
bytes = "1"
rdkafka = { version = "0.39", features = ["cmake-build"] }
rdkafka-sys = "4.10"
tokio = { version = "1", features = ["rt"] }
# Sinks de Kinesis y SQS (at-least-once). Mismas versiones que tachyon-source.
aws-sdk-kinesis = "1"
aws-sdk-sqs = "1"
aws-config = "1"
aws-types = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

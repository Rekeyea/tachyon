[package]
name = "tachyon-source"
description = "Conector fuente Redpanda (StreamTableExec)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
tachyon-core = { version = "0.1.0", path = "../tachyon-core" }
arrow.workspace = true
datafusion.workspace = true
anyhow.workspace = true
serde_json = "1"
# rdkafka con cmake-build: compila librdkafka desde fuente (necesita cmake,
# que sí está disponible). Sin SSL/SASL (llega si el broker lo exige).
rdkafka = { version = "0.39", features = ["cmake-build"] }
# FFI directo a librdkafka para consumo por lotes (rd_kafka_consume_batch_queue):
# elimina el overhead por mensaje del poll individual (~3µs/msg).
rdkafka-sys = "4.10"
apache-avro = "0.21"
ureq = { version = "2", default-features = false, features = ["json"] }
arrow-json = "58"
# Decoder JSON plano (json_flat.rs): validación UTF-8 por mensaje y búsqueda
# del cierre de strings.
simdutf8 = "0.1"
memchr = "2"
futures = "0.3"
async-stream = "0.3"
# Fuentes AWS (Kinesis y SQS): SDKs pure Rust con rustls.
aws-sdk-kinesis = "1"
aws-sdk-sqs = "1"
aws-config = "1"
# GetRecords en CBOR, firmado. Describe y el iterator de arranque siguen en el SDK.
aws-sigv4 = "1"
aws-credential-types = "1"
aws-smithy-runtime-api = { version = "1", features = ["client"] }
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots"] }
tokio.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
# para la fuente in-memory de tests
tokio-stream = "0.1"

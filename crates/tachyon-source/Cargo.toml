[package]
name = "tachyon-source"
description = "Conector fuente Redpanda (StreamTableExec)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tachyon-core = { path = "../tachyon-core" }
arrow.workspace = true
datafusion.workspace = true
anyhow.workspace = true
serde_json = "1"
# rdkafka con cmake-build: compila librdkafka desde fuente (necesita cmake,
# que sí está disponible). Sin SSL/SASL (llega si el broker lo exige).
rdkafka = { version = "0.39", features = ["cmake-build"] }
# FFI directo a librdkafka para consumo por lotes (rd_kafka_consume_batch_queue):
# elimina el overhead por mensaje del poll individual (~3µs/msg).
rdkafka-sys = "4.10"
apache-avro = "0.21"
ureq = { version = "2", default-features = false, features = ["json"] }
arrow-json = "58"
# Decoder JSON plano (json_flat.rs): validación UTF-8 por mensaje y búsqueda
# del cierre de strings.
simdutf8 = "0.1"
memchr = "2"
futures = "0.3"
async-stream = "0.3"
tokio.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
# para la fuente in-memory de tests
tokio-stream = "0.1"

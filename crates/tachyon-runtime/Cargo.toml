[package]
name = "tachyon-runtime"
description = "Runtime de ejecución de Tachyon (loop: consume -> transform -> write)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tachyon-core = { path = "../tachyon-core" }
tachyon-config = { path = "../tachyon-config" }
tachyon-sql = { path = "../tachyon-sql" }
tachyon-source = { path = "../tachyon-source" }
tachyon-sink = { path = "../tachyon-sink" }
tachyon-metrics = { path = "../tachyon-metrics" }
anyhow.workspace = true
tracing.workspace = true
datafusion.workspace = true
tokio.workspace = true
arrow.workspace = true
futures = "0.3"
rdkafka = { version = "0.39", features = ["cmake-build"] }
apache-avro = "0.21"
# Mapa de claves del operador de ventanas (hash rápido, sin orden observable).
hashbrown = "0.17"
# Valores de agregado por fila inline (sin alloc por fila en la ventana).
smallvec = "1"

[dev-dependencies]
tachyon-sink = { path = "../tachyon-sink" }
serde_yaml.workspace = true
anyhow.workspace = true
paimon = "0.3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_json = "1"
libc = "0.2"

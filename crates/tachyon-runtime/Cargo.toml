[package]
name = "tachyon-runtime"
description = "Runtime de ejecución de Tachyon (loop: consume -> transform -> write)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
tachyon-core = { version = "0.1.0", path = "../tachyon-core" }
tachyon-config = { version = "0.1.0", path = "../tachyon-config" }
tachyon-sql = { version = "0.1.0", path = "../tachyon-sql" }
tachyon-source = { version = "0.1.0", path = "../tachyon-source" }
tachyon-sink = { version = "0.1.0", path = "../tachyon-sink" }
tachyon-metrics = { version = "0.1.0", path = "../tachyon-metrics" }
tachyon-convert = { version = "0.1.0", path = "../tachyon-convert" }
paimon = "0.3"
anyhow.workspace = true
tracing.workspace = true
datafusion.workspace = true
tokio.workspace = true
arrow.workspace = true
futures = "0.3"
rdkafka = { version = "0.39", features = ["cmake-build"] }
apache-avro = "0.21"
# Inputs de AWS (Kinesis/SQS): SDKs de servicio + loader de credenciales.
aws-sdk-kinesis = "1"
aws-sdk-sqs = "1"
aws-config = "1"
aws-types = "1"
# Mapa de claves del operador de ventanas (hash rápido, sin orden observable).
hashbrown = "0.17"
# Valores de agregado por fila inline (sin alloc por fila en la ventana).
smallvec = "1"

[dev-dependencies]
tachyon-sink = { version = "0.1.0", path = "../tachyon-sink" }
serde_yaml.workspace = true
anyhow.workspace = true
paimon = "0.3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_json = "1"
libc = "0.2"

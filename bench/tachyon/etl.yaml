# Todo lo que no está acá lo deriva Tachyon del pin de CPUs del contenedor.
pipeline:
  name: ${NAME}
connectors:
  redpanda:
    brokers: [localhost:9092]
  paimon:
    warehouse: /wh/tachyon
inputs:
  - name: orders
    topic: ${TOPIC}
    key: order_id
    schema: /bench/tachyon/schemas/etl.json
output:
  name: etl_lake
  table: default.etl_lake
  key: order_id
  bucket: 8
  sequence_field: source_version
deployment:
  partitions: 8
  commit_interval: ${COMMIT}
  metrics:
    bind_addr: 127.0.0.1:9464
${TACHYON_EXTRA}

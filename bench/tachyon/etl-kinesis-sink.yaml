# Benchmark del SINK de Kinesis: input Kinesis (floCi) -> output Kinesis (floCi).
# El registro es durable al publicarse (PutRecords); at-least-once.
pipeline:
  name: ${NAME}
connectors:
  kinesis:
    region: us-east-1
    endpoint: http://localhost:4566   # floCi
inputs:
  - name: orders
    kinesis: ${STREAM}
    key: order_id
    schema: /bench/tachyon/schemas/etl.json
    start_from: trim_horizon
output:
  name: etl_out
  kinesis: ${OUT_STREAM}
  key: order_id
deployment:
  partitions: 8
  commit_interval: ${COMMIT}
  metrics:
    bind_addr: 127.0.0.1:9464
${TACHYON_EXTRA}

pipeline:
  name: ${NAME}
connectors:
  redpanda:
    brokers: [localhost:9092]
  paimon:
    warehouse: /wh/tachyon
inputs:
  - name: events
    topic: ${TOPIC}
    key: order_id
    schema: /bench/tachyon/schemas/win.json
    watermark:
      column: event_time
      lag: ${LAG_MS}ms
output:
  name: win_lake
  table: default.win_lake
  key: order_id
  bucket: 8
  sequence_field: window_end
deployment:
  partitions: 8
  commit_interval: ${COMMIT}
  metrics:
    bind_addr: 127.0.0.1:9464
${TACHYON_EXTRA}

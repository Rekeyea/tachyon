[package]
name = "redpanda-stream-spike"
description = "Slice 0.5 spike: fuente de streaming -> DataFusion Unbounded (StreamTableExec)"
version = "0.1.0"
edition = "2021"
publish = false

# Crate standalone (NO es miembro del workspace de Tachyon) para aislar la
# dependencia pesada de `datafusion` del workspace principal.
[workspace]

[dependencies]
datafusion = "55"
arrow = "59"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
anyhow = "1"
futures = "0.3"

# Collector para Tachyon: recibe OTLP/HTTP y publica métricas en formato
# Prometheus para que Prometheus (y Grafana) las scrapeen.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
    # Con el relabeling por defecto, el recurso OTel llega a Prometheus como:
    #   service.name        -> label exported_job
    #   service.instance.id -> label exported_instance
    # y los counters monotónicos salen con sufijo `_total`
    # (p. ej. tachyon.rows.read -> tachyon_rows_read_total).

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
